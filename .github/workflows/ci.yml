name: Outvier CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ── 1. Quality & Type Safety ───────────────────────────────────────────────
  quality:
    name: Code Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Backend Typecheck
        run: cd backend && npx tsc --noEmit

      - name: Frontend Typecheck
        run: cd frontend && npx tsc --noEmit

  # ── 2. Security & Vulnerability Scanning ────────────────────────────────────
  security:
    name: Security & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Dependency Vulnerability Audit
        run: |
          cd backend && npm audit --audit-level=high || true
          cd ../frontend && npm audit --audit-level=high || true

  # ── 3. Automated Test Suites ────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          npx ts-node src/tests/discovery.trusted.test.ts
          npx ts-node src/tests/application.workspace.test.ts
          npx ts-node src/tests/formatters.util.test.ts
          npx ts-node src/tests/health.observability.test.ts

  # ── 4. Playwright E2E & Accessibility Tests ─────────────────────────────────
  e2e:
    name: Playwright E2E & WCAG 2.2 Checks
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies & Playwright Browsers
        run: |
          cd frontend
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

      - name: Run Playwright Tests
        run: |
          cd frontend
          npx playwright test --project=chromium
        env:
          CI: true
